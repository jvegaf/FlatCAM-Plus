name: release

# Tag-triggered packaging. The version comes from pyproject.toml alone, and the tag has to agree
# with it, so a release can never be built from a manifest that says something else.
#
# Tool versions below are pinned by hand and were not verified against upstream from this
# environment (no network during authoring): confirm NPM/nfpm/action tags before the first run.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# Read-only by default; only the publish job needs to write, and it is the only job that does.
permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  NFPM_VERSION: "2.35.3"
  # pyqt6-qt6 publishes only a manylinux_2_34 x86_64 wheel, so that is the real floor:
  # RHEL/Alma/Rocky 9 (2.34) is the oldest distribution this can support.
  MANYLINUX_IMAGE: quay.io/pypa/manylinux_2_34_x86_64
  GLIBC_FLOOR: "2.34"
  KDE_RUNTIME_VERSION: "6.9"

jobs:
  test:
    uses: ./.github/workflows/tests.yml

  meta:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Refuse anything that is not a version tag
        # A dispatch from a branch would otherwise build the whole matrix and publish nothing;
        # stopping here costs seconds instead of an hour of the account's minutes.
        if: ${{ ! startsWith(github.ref, 'refs/tags/v') }}
        run: |
          echo "This workflow publishes releases; run it from a v* tag." >&2
          exit 1
      - uses: actions/checkout@v4
      - id: version
        name: Read the version and check the tag against it
        # No uv here on purpose: syncing the environment to read one key out of a TOML file would
        # spend a minute and a few hundred megabytes of downloads on every release.
        run: |
          set -euo pipefail
          VERSION="$(python3 -c 'import tomllib,pathlib;print(tomllib.loads(pathlib.Path("pyproject.toml").read_text(encoding="utf-8"))["project"]["version"])')"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            test "${GITHUB_REF_NAME}" = "v${VERSION}" || {
              echo "tag ${GITHUB_REF_NAME} does not match pyproject.toml ${VERSION}" >&2
              exit 1
            }
          fi

  linux-packages:
    needs: [test, meta]
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          # This workspace is bind-mounted into a container that runs fetched code; the job token
          # has no business being reachable from there.
          persist-credentials: false

      - name: Install nfpm
        run: |
          set -euo pipefail
          curl -sSfL -o /tmp/nfpm.tgz \
            "https://github.com/goreleaser/nfpm/releases/download/v${NFPM_VERSION}/nfpm_${NFPM_VERSION}_Linux_x86_64.tar.gz"
          sudo tar -C /usr/local/bin -xzf /tmp/nfpm.tgz nfpm
          nfpm --version

      # The bundle is built against glibc 2.28 so that one package starts on RHEL/Alma/Rocky 9,
      # Debian 12 and Ubuntu 22.04 alike. Building on the runner itself would raise that floor to
      # the runner's glibc and break the older targets silently.
      - name: Cache the wheel downloads
        uses: actions/cache@v4
        with:
          path: ~/.cache/uv
          key: uv-${{ hashFiles('uv.lock') }}
          restore-keys: |
            uv-

      - name: Build the bundle against the old glibc
        run: |
          set -euo pipefail
          # The interpreter this image ships is built without --enable-shared and PyInstaller
          # refuses it, so the build asks uv for a managed CPython (standalone, shared library).
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -e HOME=/tmp \
            -e UV_PYTHON_PREFERENCE=only-managed \
            -e UV_CACHE_DIR=/tmp/uv-cache \
            -v "$HOME/.cache/uv:/tmp/uv-cache" \
            -v "$PWD:/work" -w /work "${MANYLINUX_IMAGE}" /bin/bash -lc '
            set -euo pipefail
            curl -LsSf https://astral.sh/uv/install.sh | env UV_INSTALL_DIR=/tmp/uv sh
            export PATH="/tmp/uv:$PATH"
            uv python install 3.14
            uv sync --frozen
            # python3 in this image is not the project interpreter: the build script must be told.
            export PYTHON_BIN="$PWD/.venv/bin/python"
            "$PYTHON_BIN" -c "import sysconfig; assert sysconfig.get_config_var(\"Py_ENABLE_SHARED\"), \"not bundleable\""
            bash packaging/linux/build_linux_portable.sh
          '

      - name: Check the glibc floor and build the packages
        run: |
          set -euo pipefail
          bash packaging/linux/build_linux_packages.sh --skip-bundle
        env:
          GLIBC_FLOOR: ${{ env.GLIBC_FLOOR }}

      - uses: actions/upload-artifact@v4
        with:
          name: linux-packages
          path: |
            dist/installer/*.deb
            dist/installer/*.rpm
            dist/installer/*.tar.gz
          # These are compressed containers already; re-compressing them costs minutes and
          # saves nothing.
          compression-level: 0
          if-no-files-found: error

  windows-installer:
    needs: [test, meta]
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      # Without this the script falls back to whatever `python` is on PATH, which has no PyQt6.
      PYTHON_X64: ${{ github.workspace }}\.venv\Scripts\python.exe
      UV_PYTHON_PREFERENCE: only-managed
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.14"
          enable-cache: true
      - name: Install the dependencies from the lockfile
        run: |
          uv python install 3.14
          uv sync --frozen
      - name: Install Inno Setup
        run: choco install innosetup --no-progress --yes
      - name: Build the x64 installer
        shell: pwsh
        run: |
          ./packaging/windows/build_windows_installer.ps1 -Version "${{ needs.meta.outputs.version }}" -Target x64
      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: dist/installer/*.exe
          compression-level: 0
          if-no-files-found: error

  flatpak:
    needs: [linux-packages, meta]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/download-artifact@v4
        with:
          name: linux-packages
          path: dist/installer

      - name: Cache the Flatpak runtime
        uses: actions/cache@v4
        with:
          path: |
            ~/.local/share/flatpak
            ~/.cache/flatpak
          key: flatpak-kde-${{ env.KDE_RUNTIME_VERSION }}

      - name: Install flatpak-builder and the runtime
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install --yes --no-install-recommends -qq flatpak flatpak-builder
          flatpak remote-add --user --if-not-exists flathub \
            https://flathub.org/repo/flathub.flatpakrepo
          # Already installed from the cache: this only verifies and returns.
          flatpak install --user --noninteractive --yes flathub \
            "org.kde.Platform//${KDE_RUNTIME_VERSION}" "org.kde.Sdk//${KDE_RUNTIME_VERSION}"

      # The Flatpak wraps the same PyInstaller bundle as the deb and the rpm, so it reuses the
      # artifact instead of building a second one.
      - name: Build the Flatpak from the released bundle
        run: |
          set -euo pipefail
          mkdir -p dist/linux
          tar -C dist/linux -xzf dist/installer/FlatCAMPlus-*-linux-*.tar.gz
          bash packaging/flatpak/build_flatpak.sh --skip-bundle

      - uses: actions/upload-artifact@v4
        with:
          name: flatpak
          path: dist/installer/*.flatpak
          compression-level: 0
          if-no-files-found: error

  publish:
    needs: [linux-packages, windows-installer, flatpak, meta]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # A workflow_dispatch can run from a branch; publishing is tag-only, whatever triggered the run.
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.meta.outputs.version }}
        run: |
          set -euo pipefail
          ls -l dist
          gh release create "${GITHUB_REF_NAME}" dist/* \
            --title "FlatCAM Plus ${VERSION}" \
            --generate-notes
