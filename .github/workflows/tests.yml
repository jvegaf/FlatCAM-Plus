name: tests

on:
  push:
    branches: [main, dev]
    # A commit that only touches prose, task records or design notes runs nothing: this suite
    # boots the application, and every run spends the account's minutes.
    paths-ignore:
      - "**.md"
      - "odd/**"
      - ".kiro/**"
      - "design/**"
  pull_request:
    paths-ignore:
      - "**.md"
      - "odd/**"
      - ".kiro/**"
      - "design/**"
  # The release pipeline gates on this job instead of duplicating it.
  workflow_call:

permissions:
  contents: read

# A second push to the same ref supersedes the first run instead of paying for both.
concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # The suite boots the real application; it must never need a display server.
      QT_QPA_PLATFORM: offscreen
      # The interpreter this runner ships has no Tk bindings and appMain imports tkinter; a
      # uv-managed CPython ships them, so the suite runs on a known interpreter.
      UV_PYTHON_PREFERENCE: only-managed
    steps:
      - uses: actions/checkout@v4

      - name: Install the Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            libegl1 libgl1 libxkbcommon0 libdbus-1-3

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.14"
          enable-cache: true
      - name: Make sure the managed interpreter is present
        run: uv python install 3.14

      - name: Install dependencies from the lockfile
        run: uv sync --frozen

      - name: Run the test suite
        run: uv run --with pytest pytest tests -q
