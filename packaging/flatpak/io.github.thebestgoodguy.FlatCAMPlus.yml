# Flatpak manifest for the self-hosted bundle published in the GitHub release.
#
# This is not a Flathub submission: Flathub forbids shipping a prebuilt binary payload, which is
# exactly what a PyInstaller bundle is. The payload carries its own Qt, and it does ship the
# Wayland platform plugin (``libqwayland.so``), so the app runs natively on the session it is
# given instead of being pinned to one backend.
app-id: io.github.thebestgoodguy.FlatCAMPlus
runtime: org.kde.Platform
runtime-version: "6.11"
sdk: org.kde.Sdk
command: flatcam-plus

finish-args:
  # Native Wayland, with X11 as the fallback for an X11-only session. Pinning xcb made the
  # bundled Qt go through XWayland, where it could not obtain a GL context ("qglx_findConfig:
  # Failed to finding matching FBConfig", then "Could not initialize GLX") and the app exited at
  # start-up on a hybrid-GPU machine.
  - --socket=wayland
  - --socket=fallback-x11
  - --share=ipc
  - --device=dri
  - --talk-name=org.freedesktop.Notifications
  # The same launcher the deb and the rpm install, pointed at the sandbox path.
  - --env=FLATCAM_PLUS_HOME=/app/lib/flatcam-plus

modules:
  - name: flatcam-plus
    buildsystem: simple
    build-options:
      # The payload is a frozen application: stripping it buys nothing and the .Debug
      # runtime it generates is never published.
      strip: false
    build-commands:
      - install -d /app/lib/flatcam-plus
      - cp -a payload/FlatCAM-Plus/. /app/lib/flatcam-plus/
      - install -Dm755 flatcam-plus.sh /app/bin/flatcam-plus
      - install -Dm644 flatcam-plus.desktop /app/share/applications/flatcam-plus.desktop
      - install -Dm644 app256.png /app/share/icons/hicolor/256x256/apps/flatcam-plus.png
      - install -Dm644 flatcam-plus.metainfo.xml /app/share/metainfo/flatcam-plus.metainfo.xml
    sources:
      - type: dir
        path: ../../dist/linux
        dest: payload
      - type: file
        path: ../linux/flatcam-plus.sh
      - type: file
        path: ../linux/flatcam-plus.desktop
      - type: file
        path: ../linux/flatcam-plus.metainfo.xml
      - type: file
        path: ../../flatcam_plus/assets/resources/app256.png
