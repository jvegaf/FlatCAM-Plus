name: flatcam-plus
arch: amd64
platform: linux
version: ${VERSION}
section: graphics
priority: optional
maintainer: Jose Vega <josevega234@gmail.com>
description: |
  PCB CAM and CNC workflow.
  Gerber, Excellon, DXF and SVG import; isolation routing, drilling, cutout and
  milling toolpaths; G-code generation through selectable preprocessors, with a
  3D preview and a pen-plotter workflow. The payload is a self-contained
  PyInstaller bundle, so no Python environment is required on the target.
vendor: FlatCAM Plus
homepage: https://github.com/thebestgoodguy/FlatCAM-Plus
license: MIT
depends:
  - libgl1
  - libegl1
  - libxkbcommon0
  - libdbus-1-3
  - libfontconfig1
  - libfreetype6
recommends:
  - libgl1-mesa-dri
  - xdg-utils
contents:
  - src: dist/linux/FlatCAM-Plus
    dst: /opt/flatcam-plus
  - src: packaging/linux/flatcam-plus.sh
    dst: /usr/bin/flatcam-plus
    file_info:
      mode: 0755
  - src: packaging/linux/flatcam-plus.desktop
    dst: /usr/share/applications/flatcam-plus.desktop
    file_info:
      mode: 0644
  - src: assets/resources/app256.png
    dst: /usr/share/icons/hicolor/256x256/apps/flatcam-plus.png
    file_info:
      mode: 0644
  - src: packaging/linux/flatcam-plus.metainfo.xml
    dst: /usr/share/metainfo/flatcam-plus.metainfo.xml
    file_info:
      mode: 0644
rpm:
  group: Applications/Engineering
  summary: PCB CAM and CNC workflow
# The top-level dependency names are Debian's; the RPM distributions use their own for the same
# libraries, so both lists are spelled out rather than shared.
overrides:
  deb:
    recommends:
      - libxcb-cursor0
  rpm:
    depends:
      - mesa-libGL
      - mesa-libEGL
      - libxkbcommon
      - dbus-libs
      - fontconfig
      - freetype
    recommends:
      - mesa-dri-drivers
      - xdg-utils
