[project]
name = "flatcam-plus"
version = "1.3.1"
description = "Legacy PyQt6 desktop CAM application for PCB/CNC manufacturing"
readme = "README.md"
authors = [
    { name = "Jose Vega", email = "josevega234@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "cycler>=0.10",
    "darkdetect>=0.8.0",
    "dill>=0.4.1",
    "ezdxf>=1.4.5",
    "fonttools>=4.68.0",
    "freetype-py>=2.5.1",
    "greenlet>=3.5.6",
    "kiwisolver>=1.1",
    "lxml>=6.1.3",
    "matplotlib>=3.5.0",
    "numpy>=1.16",
    "ortools>=7.0",
    "pikepdf>=2.0",
    "pyopengl>=3.1.10",
    "pyppeteer>=0.0.25",
    "pyqt6==6.11.0",
    "pyqt6-qt6==6.11.0",
    "pyqt6-sip>=13.8,<14",
    "pyserial>=3.4",
    "python-dateutil>=2.1",
    "qrcode>=6.1",
    "rasterio>=1.5.2",
    "reportlab>=3.5",
    "rtree>=1.4.1",
    "setuptools>=84.2.1",
    "shapely>=2.0",
    "simplejson>=4.2.0",
    "six>=1.17.0",
    "svg-path>=4.0",
    "svglib>=2.3.2",
    "svgtrace>=2023.0.1",
    "vispy>=0.9.0",
]

[dependency-groups]
# The bundle builders need it; `uv sync` installs it, so a clean checkout can build.
dev = ["pyinstaller>=6.10"]

[tool.uv]
# The application is the repository root itself (legacy FlatCAM layout) and runs
# with `.venv/bin/python flatcam.py`. It is not an installable package: `uv sync`
# installs dependencies only, and there is no wheel or console script to build.
package = false

[tool.pytest.ini_options]
# `flatcam_plus` is importable because it sits at the repository root, and the application's
# data directories (`assets`, `config`, `locale`, `preprocessors`) live there too, so the suite
# needs the root on `sys.path`. Declaring it here replaces the hand-rolled insert that used to
# live in `tests/conftest.py`.
pythonpath = ["."]
